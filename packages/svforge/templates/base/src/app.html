<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="svelteForge">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- #325: the SVG icon is the primary (rendered by every modern
		     browser); the prerendered /favicon.ico route answers direct
		     requests from crawlers and legacy consumers. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
