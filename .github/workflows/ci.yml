name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run --no-file-parallelism

      - name: Scaffold test (base)
        run: bash scripts/test-scaffold.sh base

      - name: Scaffold test (dashboard)
        run: bash scripts/test-scaffold.sh dashboard

      - name: Scaffold test (dashboard + playwright)
        run: bash scripts/test-scaffold.sh dashboard-playwright
