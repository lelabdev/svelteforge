name: Better Auth upgrade

# ============================================================================
# BETTER AUTH UPGRADE POLICY (#319)
# ============================================================================
# The dashboard scaffold pins better-auth with a concrete tilde range — NEVER
# `latest` (#197). The pin lives in packages/svforge/src/modes/dashboard.ts
# (mirrored in packages/svforge/templates/dashboard/package.json; the drift
# guard is tests/better-auth-upgrade.test.ts).
#
#   - BLOCKING SECURITY PATCHES → auto-PR IMMEDIATELY.
#     Runs daily (cheap npm + OSV check). When a CRITICAL/HIGH advisory
#     affects the pinned version and the latest stable fixes it, the full
#     gate runs and the upgrade PR opens the same day.
#   - TESTED MINORS AND PATCHES → auto-PR WEEKLY (Monday 07:00 UTC).
#     The PR opens ONLY after the full dashboard scaffold gate passes against
#     real PostgreSQL: repository tests, scripts/test-scaffold.sh dashboard
#     (build + svelte-check + template vitest + schema drift gate + HTTP smoke:
#     setup → admin login → admin CRUD → created-user sign-in) and the
#     better-auth stack vulnerability audit (critical/high threshold).
#   - MAJORS → EXPLICIT MIGRATION ISSUE, NEVER A PR. A major bump needs a
#     human migration plan (see docs/better-auth-upgrades.md).
#   - PRERELEASES are never upgraded automatically.
#
# Vulnerability gate: scripts/better-auth-audit.mjs audits the resolved
# better-auth stack (better-auth + @better-auth/* + their full dependency
# closure, including hoisted transitive packages) against OSV.dev and fails
# the job on CRITICAL/HIGH advisories. Documented
# reachability exceptions use the existing docs/audit-baseline.json mechanism
# (#351) — scoped { package, version, advisory, path, reason } entries.
#
# NOTE: @better-auth/cli is deliberately NOT part of this automation. Since
# #319 it is not a scaffold dependency at all (its nested @better-auth/core
# hoists over the runtime's copy and breaks the SSR build); the generator
# runs via bunx with a pinned version (smoke-tested by the gate), and the
# committed schema is gated against the INSTALLED better-auth runtime inside
# the scaffold gate.
# ============================================================================

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC — tested minors & patches
    - cron: '0 6 * * *' # Daily 06:00 UTC — security escalation check
  workflow_dispatch:
    inputs:
      version:
        description: 'Target better-auth version (defaults to npm dist-tags.latest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: better-auth-upgrade
  cancel-in-progress: false

env:
  DAILY_CRON: '0 6 * * *'

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      pinned: ${{ steps.detect.outputs.pinned }}
      latest: ${{ steps.detect.outputs.latest }}
      changelog: ${{ steps.detect.outputs.changelog }}
      advisories: ${{ steps.detect.outputs.advisories }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect upgrade mode
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PINNED=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { readPinnedVersions } from './scripts/better-auth-upgrade.mjs';
            const pins = readPinnedVersions(readFileSync('packages/svforge/src/modes/dashboard.ts', 'utf8'));
            console.log(pins.find((p) => p.name === 'better-auth').version);
          ")
          if [ -n "${INPUT_VERSION:-}" ]; then
            LATEST="$INPUT_VERSION"
          else
            LATEST=$(npm view better-auth version)
          fi
          echo "pinned=$PINNED latest=$LATEST"

          # Advisories affecting the PINNED version (OSV.dev, GHSA severity).
          ADVISORIES=$(node --input-type=module -e "
            import { queryOsv } from './scripts/audit.mjs';
            import { severityOf } from './scripts/better-auth-audit.mjs';
            const results = await queryOsv([{ name: 'better-auth', version: '$PINNED', paths: 'better-auth' }]);
            const vulns = results?.results?.[0]?.vulns ?? [];
            console.log(JSON.stringify(vulns.map((v) => ({ id: v.id, severity: severityOf(v) }))));
          ")
          echo "advisories=$ADVISORIES"

          PLAN=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { planUpgrade } from './scripts/better-auth-upgrade.mjs';
            const plan = planUpgrade({
              name: 'better-auth',
              pinned: '$PINNED',
              latest: '$LATEST',
              advisories: $ADVISORIES
            });
            console.log(JSON.stringify(plan));
          ")
          MODE=$(node -e "console.log(JSON.parse(process.argv[1]).mode)" "$PLAN")
          CHANGELOG=$(node -e "console.log(JSON.parse(process.argv[1]).changelog ?? '')" "$PLAN")

          # The daily run only escalates SECURITY bumps; weekly cadence waits
          # for the Monday cron. Manual runs (workflow_dispatch) go through.
          if [ -n "${SCHEDULE:-}" ] && [ "$SCHEDULE" = "$DAILY_CRON" ] && [ "$MODE" = "weekly" ]; then
            echo "daily run, no blocking advisory — waiting for the weekly pass"
            MODE="none"
          fi

          # Idempotency: a branch for this target version already exists → skip.
          if git ls-remote --heads origin "bot/better-auth-$LATEST" | grep -q "$LATEST"; then
            echo "branch bot/better-auth-$LATEST already exists — skipping"
            MODE="none"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "advisories=$(node -e "console.log(JSON.stringify(JSON.parse(process.argv[1]).filter(a => ['CRITICAL','HIGH'].includes(a.severity)).map(a => a.id)))" "$ADVISORIES")" >> "$GITHUB_OUTPUT"

  upgrade:
    needs: detect
    if: needs.detect.outputs.mode == 'security' || needs.detect.outputs.mode == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # PostgreSQL for the dashboard scaffold gate (#255): the scaffold runs a
    # real drizzle push, the template vitest baseline and the HTTP smoke.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bump the pin in every carrier
        run: |
          node scripts/better-auth-upgrade.mjs apply \
            --better-auth "${{ needs.detect.outputs.latest }}"
          git diff --stat

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts || bun install --ignore-scripts

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run repository tests
        run: bun x vitest run --no-file-parallelism

      # The gate: real scaffold + real PostgreSQL + real Better Auth version.
      - name: Dashboard scaffold gate (build, check, vitest, schema drift gate, HTTP smoke)
        run: bash scripts/test-scaffold.sh dashboard

      # Runtime vulnerability audit of the resolved better-auth stack:
      # critical/high blocks; documented exceptions via docs/audit-baseline.json.
      - name: Better Auth stack vulnerability audit (critical/high threshold)
        run: |
          AUDIT_DIR="$(mktemp -d)"
          cd "$AUDIT_DIR"
          echo '{ "name": "better-auth-stack-audit", "private": true }' > package.json
          bun add "better-auth@${{ needs.detect.outputs.latest }}" >/dev/null
          cd "$GITHUB_WORKSPACE"
          node scripts/better-auth-audit.mjs "$AUDIT_DIR/bun.lock"

      - name: Open the upgrade PR
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.detect.outputs.mode }}
          PINNED: ${{ needs.detect.outputs.pinned }}
          LATEST: ${{ needs.detect.outputs.latest }}
          CHANGELOG: ${{ needs.detect.outputs.changelog }}
          ADVISORIES: ${{ needs.detect.outputs.advisories }}
        run: |
          git config user.name "svelteforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "bot/better-auth-$LATEST"
          git add -A
          git commit -m "chore(deps): bump better-auth from $PINNED to $LATEST

          Policy: docs/better-auth-upgrades.md (#319). Mode: $MODE.
          Gate: repository tests + dashboard scaffold gate (PostgreSQL) +
          better-auth stack audit (critical/high)."
          git push origin "bot/better-auth-$LATEST"

          BODY=$(cat <<EOF
          ## Better Auth upgrade: \`$PINNED\` → \`$LATEST\`

          Policy: [docs/better-auth-upgrades.md](docs/better-auth-upgrades.md) (#319) — mode: **$MODE**.

          - Changelog: $CHANGELOG
          - Blocking advisories fixed by this upgrade: ${ADVISORIES:-none}
          - Scaffold stays pinned (never \`latest\`, #197).

          ### Gate (all green on this branch)
          - Repository tests (vitest)
          - \`bash scripts/test-scaffold.sh dashboard\` — build, svelte-check, template vitest
            (credential lifecycle + admin CRUD on real PostgreSQL), the schema drift gate
            (committed auth.schema.ts vs the installed better-auth runtime) and the
            HTTP smoke: setup → admin login → admin CRUD → created-user sign-in.
          - Better Auth stack audit — critical/high threshold, baseline: \`docs/audit-baseline.json\`.

          Squash-merge only after human review.
          EOF
          )
          PR_URL=$(gh pr create \
            --title "chore(deps): bump better-auth $PINNED → $LATEST" \
            --body "$BODY" \
            --label dependencies 2>/dev/null || gh pr create \
            --title "chore(deps): bump better-auth $PINNED → $LATEST" \
            --body "$BODY")
          echo "PR: $PR_URL"
          if [ "$MODE" = "security" ]; then
            gh pr edit "$PR_URL" --add-label security 2>/dev/null || true
          fi

      - name: Report a failed gate
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.detect.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Better Auth upgrade gate failed for $LATEST" \
            --body "The upgrade to \`$LATEST\` did NOT pass the dashboard scaffold gate, so **no upgrade PR was opened** (policy: only tested versions auto-PR — docs/better-auth-upgrades.md #319).

          Run: $RUN_URL

          Investigate the failure, fix the template if needed, and re-run the workflow." \
            2>/dev/null || echo "gate-failure issue already exists or could not be created"

  major:
    needs: detect
    if: needs.detect.outputs.mode == 'major'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Open a migration issue (never a PR)
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ needs.detect.outputs.pinned }}
          LATEST: ${{ needs.detect.outputs.latest }}
          CHANGELOG: ${{ needs.detect.outputs.changelog }}
        run: |
          gh issue create \
            --title "Better Auth major migration: $PINNED → $LATEST" \
            --body "better-auth published a MAJOR release (\`$PINNED\` → \`$LATEST\`). Per the upgrade policy (docs/better-auth-upgrades.md, #319) **majors are never auto-PR'd**: they need an explicit migration plan, a template audit (auth model, schema, admin users, hooks) and a security review of the fixed advisories.

          - Changelog / release notes: $CHANGELOG
          - Current pin: \`packages/svforge/src/modes/dashboard.ts\`

          Checklist:
          - [ ] Review the breaking changes in the release notes
          - [ ] Audit the dashboard template auth stack (auth.ts, admin-users.ts, hooks.server.ts, auth.schema.ts)
          - [ ] Re-verify the credential contract tests and the scaffold smoke
          - [ ] Bump the pin and land through a reviewed PR" \
          2>/dev/null || echo "migration issue already exists"
