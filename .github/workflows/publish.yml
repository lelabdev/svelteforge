name: Publish

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish-latest:
    runs-on: ubuntu-latest

    # PostgreSQL for the real DB scaffold gate (#255/#256)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: bun run --filter '*' build

      - name: Run tests
        run: bun x vitest run

      # Scaffold gate (#191): never publish a package whose scaffold cannot build
      - name: Scaffold test (base)
        run: bash scripts/test-scaffold.sh base

      - name: Scaffold test (dashboard)
        run: bash scripts/test-scaffold.sh dashboard

      # Composition gate (#258): the new foundations must keep composing
      # against real PostgreSQL before any package is published.
      - name: Scaffold test (dashboard-foundations)
        run: bash scripts/test-scaffold.sh dashboard-foundations
        env:
          CI: 'true'

      # Consumer coverage gate (#284): historical modules must compile inside
      # real consumer scaffolds before any package is published.
      - name: Scaffold test (base-ui-modules)
        run: bash scripts/test-scaffold.sh base-ui-modules

      - name: Scaffold test (dashboard-integrations)
        run: bash scripts/test-scaffold.sh dashboard-integrations
        env:
          CI: 'true'

      - name: Publish ui_toast@latest
        run: cd packages/ui_toast && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dnd@latest
        run: cd packages/dnd && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish graph@latest
        run: cd packages/graph && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish tiptap@latest
        run: cd packages/tiptap && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish email@latest
        run: cd packages/email && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish oauth@latest
        run: cd packages/oauth && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish uploads@latest
        run: cd packages/uploads && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish blog@latest
        run: cd packages/blog && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # New foundation modules (#256): published with the other scoped
      # @svforge/* packages, before the unscoped svforge.
      - name: Publish realtime@latest
        run: cd packages/realtime && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish audit@latest
        run: cd packages/audit && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish notifications@latest
        run: cd packages/notifications && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish jobs@latest
        run: cd packages/jobs && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish chat@latest
        run: cd packages/chat && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Unscoped package — published LAST: it's the one the current NPM_TOKEN
      # cannot write (E404, ownership ludoloops). Modules go first so a token
      # with scoped rights still ships them; svforge needs a token with write
      # access on the unscoped name (#206 Phase 7).
      - name: Publish svforge@latest
        run: cd packages/svforge && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
